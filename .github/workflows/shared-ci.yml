name: Individual Branch CI

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch whose documentation should be deployed"
        required: true
        type: string

# Only one deployment may modify gh-pages at a time.
# Additional runs wait in GitHub's native queue.
concurrency:
  group: docs-deployment
  queue: max

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Every caller supplies the branch explicitly; there is no fallback.
    env:
      SOURCE_BRANCH: ${{ inputs.branch }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          if ! [[ "$BRANCH" =~ ^(main|release-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$BRANCH' is not main or a valid release-vX.Y.Z branch."
            exit 1
          fi

          echo "Deploying documentation from branch: $BRANCH"

      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Deploy documentation
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          # Titles are always mike's default (the version identifier itself), so
          # nothing ever has to be relabelled when 'latest' moves. The aliases and
          # the root redirect are the only things that carry "which one is newest".

          if [[ "$BRANCH" == main ]]; then

            # main is the in-progress docs. It is never a release, never 'latest',
            # and 'next' cannot match the version pattern below.
            echo "Deploying $BRANCH as next"

            mike deploy --update-aliases --push next

            exit 0

          fi

          VERSION="${BRANCH#release-}"

          echo "Deploying release branch: $BRANCH as $VERSION"

          # 'latest' is decided against what is already published. gh-pages may not
          # exist yet (mike creates it on first deploy), and there is no local
          # gh-pages branch before that, so read the remote-tracking ref and treat
          # anything missing as "nothing published yet".
          EXISTING_VERSIONS=""

          if git rev-parse --verify --quiet refs/remotes/origin/gh-pages >/dev/null; then
            EXISTING_VERSIONS="$(
              git show origin/gh-pages:versions.json 2>/dev/null |
              jq -r '
                .[]
                | .version
                | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              ' || true
            )"
          else
            echo "No gh-pages branch yet; this deploy will create it."
          fi

          echo "Published versions:"
          printf '%s\n' "$EXISTING_VERSIONS"

          # Compare against published versions *plus this one*, so the answer is
          # correct without having to deploy first. Rebuilding an older branch
          # therefore never steals the aliases, whatever order runs complete in.
          LATEST_VERSION="$(
            {
              printf '%s\n' "$EXISTING_VERSIONS"
              printf '%s\n' "$VERSION"
            } |
            sed '/^$/d' |
            sort -V |
            tail -n 1
          )"

          echo "Current version: $VERSION"
          echo "Highest version: $LATEST_VERSION"

          if [[ "$VERSION" == "$LATEST_VERSION" ]]; then

            echo "Deploying $VERSION as latest and stable"

            mike deploy \
              --update-aliases \
              --push \
              --alias-type=copy \
              "$VERSION" latest stable

            mike set-default --push latest

          else

            echo "$VERSION is not the highest version; deploying without aliases"

            mike deploy --update-aliases --push "$VERSION"

          fi

      - name: Report completion
        shell: bash
        run: |
          echo "Mike processing completed."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"